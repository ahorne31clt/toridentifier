<!DOCTYPE html>
<html>
<body>

  <!-- Leave src empty; JavaScript will fill it in -->
  <img id="random-image" src="" alt="Randomly selected image">

  <script>
    // 1. Pick a random whole number between 1 and 5
    const randomNumber = Math.floor(Math.random() * 5) + 1;

    // 2. Build the file path (change .jpg if your files are .png or .webp)
    const imagePath = `/images/${randomNumber}.jpg`;

    // 3. Apply the path to the <img> element
    document.getElementById("random-image").src = imagePath;
  </script>

</body>
</html>
