<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191c">
  <title>Feedback | Tornado Guesser</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      color: #f3f0e7;
      background: #17191c;
      --cream: #f3f0e7;
      --muted: #b5bcc3;
      --red: #f38b86;
      --gold: #e5ba79;
      --line: #383e45;
      --panel: #202328;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; min-height: 100vh; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(105deg, #17191c 8%, #17191c80 44%, #17191c11 100%),
        repeating-radial-gradient(ellipse at 83% -17%, transparent 0 16px, #a7b9c21d 17px 18px, transparent 19px 28px),
        repeating-radial-gradient(ellipse at 100% 14%, transparent 0 23px, #929fa710 24px 25px, transparent 26px 37px),
        radial-gradient(ellipse at 78% 0%, #423338, #17191c 68%);
    }
    .shell { width: min(100% - 64px, 1376px); margin-inline: auto; }
    .masthead { background: #181b1fe8; border-bottom: 1px solid var(--line); }
    .masthead-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .identity { display: flex; align-items: center; gap: 11px; color: var(--cream); text-decoration: none; }
    .identity:hover .wordmark { text-decoration: underline; text-underline-offset: .22em; }
    .identity:focus-visible, :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .brand-mark { display: block; width: 46px; height: 46px; }
    .wordmark { font-size: 1.2rem; line-height: 1; font-weight: 800; text-transform: uppercase; letter-spacing: .055em; white-space: nowrap; }
    .wordmark strong { color: var(--red); }
    .masthead-actions { display: flex; align-items: center; gap: 8px; }

    main.shell { display: grid; place-items: start center; padding: clamp(32px, 7vw, 72px) 0; }
    .feedback-card {
      width: min(720px, 100%);
      border: 1px solid var(--line);
      border-top: 3px solid var(--red);
      background: var(--panel);
      box-shadow: 0 12px 32px #0004;
    }
    .feedback-head { padding: 24px 28px 18px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--red); font-size: .875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .11em; }
    h1 { margin: 7px 0 8px; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1; letter-spacing: -.04em; }
    .intro { margin: 0; color: var(--muted); line-height: 1.55; }
    form { display: grid; gap: 18px; padding: 24px 28px 28px; }
    fieldset { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0; border: 0; }
    legend, label { font-weight: 700; }
    legend { margin-bottom: 8px; }
    .field { display: grid; gap: 8px; }
    input:not([type="radio"]):not([type="checkbox"]), select, textarea {
      width: 100%; min-height: 44px; padding: 10px 11px;
      border: 1px solid #5e6972; border-radius: 0;
      background: #191d21; color: var(--cream);
      font: inherit;
    }
    textarea { min-height: 150px; resize: vertical; line-height: 1.45; }
    input::placeholder, textarea::placeholder { color: #8f999f; }
    select { cursor: pointer; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; }
    .choice label {
      display: grid; place-items: center; min-height: 44px; padding: 8px;
      border: 1px solid #4d5862; background: #292e34; cursor: pointer;
    }
    .choice input:checked + label { border-color: var(--red); background: #48292c; color: var(--red); }
    .choice input:focus-visible + label { outline: 2px solid var(--gold); outline-offset: 2px; }
    .hint { color: var(--muted); font-size: .875rem; line-height: 1.4; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .button { background: #292e34; color: var(--cream); border: 1px solid #4d5862; min-height: 44px; padding: 10px 14px; border-radius: 0; font: 700 .9375rem/1.2 Arial, sans-serif; text-decoration: none; cursor: pointer; }
    .button.primary { background: var(--red); border-color: var(--red); color: #231415; }
    .button.primary:hover { background: #ffaaa4; }
    .button.outline { background: #20252a; }
    .back-link { color: var(--muted); }
    .status { min-height: 1.4em; margin: 0; color: var(--gold); }
    @media (max-width: 760px) {
      .shell { width: calc(100% - 28px); }
      .masthead-inner { min-height: 62px; }
      .wordmark { font-size: 1rem; }
      .brand-mark { width: 38px; height: 38px; }
    }
    @media (max-width: 510px) {
      .feedback-head, form { padding-inline: 18px; }
      fieldset { grid-template-columns: 1fr; }
      .actions { align-items: stretch; flex-direction: column-reverse; }
      .actions .button { width: 100%; text-align: center; }
      .wordmark strong { display: block; }
      .masthead-inner { flex-wrap: wrap; padding-block: 10px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="identity" href="./" aria-label="Tornado Guesser home">
        <img class="brand-mark" src="./logo.png" alt="" width="46" height="46">
        <span class="wordmark">Tornado <strong>Guesser</strong></span>
      </a>
    </div>
  </header>

  <main class="shell">
    <section class="feedback-card" aria-labelledby="feedback-title">
      <header class="feedback-head">
        <span class="eyebrow">Help improve the game</span>
        <h1 id="feedback-title">Send feedback</h1>
        <p class="intro">Tell us what worked, what broke, or what you would like to see next.</p>
      </header>

      <form id="feedback-form" action="https://formspree.io/f/xbgopadq" method="POST">
        <div class="field">
          <label for="category">Feedback type</label>
          <select id="category" name="feedback_type" required>
            <option value="" selected disabled>Choose a type</option>
            <option value="bug">Bug or technical problem</option>
            <option value="feature">Feature request</option>
            <option value="content">Photo or event content</option>
            <option value="scoring">Scoring or leaderboard</option>
            <option value="praise">General praise</option>
            <option value="other">Other</option>
          </select>
        </div>

        <fieldset>
          <legend>Overall experience</legend>
          <div class="choice">
            <input type="radio" id="rating-positive" name="rating" value="Good" required>
            <label for="rating-positive">Good</label>
          </div>
          <div class="choice">
            <input type="radio" id="rating-neutral" name="rating" value="Okay">
            <label for="rating-neutral">Okay</label>
          </div>
          <div class="choice">
            <input type="radio" id="rating-negative" name="rating" value="Needs work">
            <label for="rating-negative">Needs work</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="message">What would you like to tell us?</label>
          <textarea id="message" name="message" minlength="10" maxlength="3000" required placeholder="Describe the issue or idea. Include any steps that caused a problem."></textarea>
          <span class="hint">Please don’t include passwords or private account details.</span>
        </div>

        <div class="field">
          <label for="email">Email <span class="hint">(optional)</span></label>
          <input type="email" id="email" name="email" maxlength="254" placeholder="you@example.com" autocomplete="email">
          <span class="hint">Only used if we need to follow up.</span>
        </div>

        <input type="hidden" name="page" value="Tornado Guesser feedback">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" hidden>

        <p id="feedback-status" class="status" role="status" aria-live="polite"></p>
        <div class="actions">
          <a class="back-link" href="./">Back to the game</a>
          <button class="button primary" type="submit">Send feedback</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.querySelector('#feedback-form');
    const status = document.querySelector('#feedback-status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Sending…';
      status.textContent = '';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        });

        if (response.ok) {
          form.reset();
          status.textContent = 'Thank you — your feedback was sent.';
          submitButton.textContent = 'Sent';
          return;
        }

        throw new Error('Submission failed');
      } catch (error) {
        status.textContent = 'The form could not be sent right now. Please try again.';
        submitButton.disabled = false;
        submitButton.textContent = 'Send feedback';
      }
    });
  </script>
</body>
</html>
